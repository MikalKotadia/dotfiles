onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "system"

[keys]
workspace_picker = "prefix+s"
settings = "prefix+comma"
split_vertical = "prefix+|"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_right = "l"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "${SHELL:-/bin/sh}"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "lazydocker"
width = "100%"
height = "100%"

[ui]
status_indicators = "symbols"
